[driver]
id = "ecobee.hap.thermostat"
name = "Ecobee Thermostat (HomeKit)"
manufacturer = "Ecobee"
version = "1.0.0"
runtime = "wasm"

# The same hardware as `ecobee.thermostat`, reached over HomeKit on the LAN instead of the
# cloud API. It keeps working when the internet does not, answers in milliseconds rather than
# seconds, and is not rate-limited — so the poll interval here is seconds, not minutes.
#
# What it gives up is real, and the capabilities below say so rather than failing at 2am:
# HomeKit's Thermostat service has no fan-mode and no hold characteristic, so `has_fan_control`
# and `has_hold` are false. Use the cloud driver if those matter more than working offline.
[[proxy]]
id = 1
type = "thermostat"
primary = true
name = "Thermostat"
capabilities = { has_heat = true, has_cool = true, has_auto = true, has_fan_control = false, has_hold = false, has_humidity = true, setpoint_min_c = 7.0, setpoint_max_c = 33.0, setpoint_step_c = 0.5, stage_count = 2 }

# The thermostat's own built-in sensors, one binding per measured quantity so an automation can
# trigger on occupancy alone.
[[proxy]]
id = 2
type = "sensor"
name = "Occupancy"
capabilities = { kind = "occupancy", is_boolean = true, auto_clear_seconds = 1800 }

[[proxy]]
id = 3
type = "sensor"
name = "Temperature"
capabilities = { kind = "temperature", unit = "°C", value_min = -20.0, value_max = 50.0 }

[[transport]]
kind = "network"
port = 80

[[property]]
name = "Address"
type = "string"
tooltip = "The thermostat's IP address, found automatically over mDNS"

[[property]]
name = "Port"
type = "ranged_int"
min = 1
max = 65535
default = 80
tooltip = "The HomeKit port the thermostat advertised — not usually 80, and not editable by hand"

[[property]]
name = "Accessory id"
type = "string"
tooltip = "Issued during HomeKit pairing — do not edit by hand"

[[property]]
name = "Accessory key"
type = "password"
tooltip = "The thermostat's HomeKit public key, issued during pairing — do not edit by hand"

[[property]]
name = "Controller id"
type = "string"
tooltip = "This controller's HomeKit identity for this thermostat — do not edit by hand"

[[property]]
name = "Controller key"
type = "password"
tooltip = "This controller's HomeKit private key, issued during pairing — do not edit by hand"

[[property]]
name = "Poll interval"
type = "ranged_int"
min = 5
max = 900
default = 30
unit = "s"
tooltip = "How often to ask the thermostat where it stands. Local, so this can be seconds."

[discovery]
mdns = ["_hap._tcp"]
mac_oui = ["44:61:32"]
