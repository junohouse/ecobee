[driver]
id = "ecobee.hap.sensor"
name = "Ecobee Room Sensor (HomeKit)"
manufacturer = "Ecobee"
version = "1.0.0"
runtime = "wasm"
# A SmartSensor is bridged by the thermostat, so it inherits the address and the pairing —
# there is nothing to pair a second time. Put it in the room it is actually in; that is what
# makes "is anyone in the den?" answerable.
parent = "ecobee.hap.thermostat"

[[proxy]]
id = 1
type = "sensor"
primary = true
name = "Occupancy"
capabilities = { kind = "occupancy", is_boolean = true, auto_clear_seconds = 1800 }

[[proxy]]
id = 2
type = "sensor"
name = "Temperature"
capabilities = { kind = "temperature", unit = "°C", value_min = -20.0, value_max = 50.0 }

[[property]]
name = "Accessory aid"
type = "ranged_int"
min = 1
max = 4294967295
default = 2
tooltip = "Which bridged accessory this sensor is, in the thermostat's HomeKit database"
